name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn tsc
      - run: yarn lint
      - run: yarn test
      - run: yarn build
        env:
          NEXT_PUBLIC_APP_URL: https://creativeotter-app.vercel.app
          NEXT_PUBLIC_SUPABASE_URL: https://build-only.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-public-placeholder
